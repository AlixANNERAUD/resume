name: Build and deploy the resume

on:
  # Publish on every push to the default branch
  push:
    branches: ["main"]

  # Build pull requests without deploying them
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; pull request builds are grouped per branch.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TYPST_FLAGS: --root . --font-path fonts --ignore-system-fonts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup | Typst
        uses: typst-community/setup-typst@v5.3.1
        with:
          typst-version: 0.15.1

      - name: Build | Resumes
        run: |
          mkdir -p public
          typst compile $TYPST_FLAGS English/Resume.typ public/Resume.english.pdf
          typst compile $TYPST_FLAGS Français/Resume.typ public/Resume.français.pdf

      - name: Check | One page each
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          for lang in English Français; do
            rm -f "$RUNNER_TEMP"/pages/*
            typst compile $TYPST_FLAGS --ppi 10 "$lang/Resume.typ" "$RUNNER_TEMP/pages/page-{p}.png"
            pages=$(ls "$RUNNER_TEMP"/pages | wc -l)
            echo "$lang: $pages page(s)"
            [ "$pages" -eq 1 ] || { echo "::error file=$lang/Resume.typ::expected exactly one page, got $pages"; exit 1; }
          done

      - name: Upload | Pull request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: resumes
          path: public/*.pdf

      - name: Setup | GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload | Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy | GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The single check required on main. Add any new check job to `needs` so
  # that branch protection keeps one stable check name.
  required:
    name: Required
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
